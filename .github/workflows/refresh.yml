name: Refresh brackets and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 20 minutes during play hours only (Winnipeg is UTC-5 this weekend), to stay
    # inside Challonge's free 500 API requests a month (about 3 requests per run, about 400 total):
    #   Fri 6 PM-3 AM, Sat 10 AM-3 AM, Sun 10 AM-3 AM.
    # GitHub may delay scheduled runs by a few minutes when busy.
    - cron: '*/20 23 20 11 *'
    - cron: '*/20 0-7 21-23 11 *'
    - cron: '*/20 15-23 21-22 11 *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Main Event and Hard Luck from the Challonge API
        id: fetch
        if: github.event_name != 'push'
        env:
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
        run: |
          set +e
          python3 scripts/challonge_api.py ctegjndn jjwwzfei
          rc=$?
          set -e
          if [ $rc -eq 2 ]; then
            echo "::warning::Add the CHALLONGE_CLIENT_ID and CHALLONGE_CLIENT_SECRET repository secrets to turn on refreshes."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ $rc -ne 0 ]; then exit 1; fi
          if git diff --quiet -- raw/; then
            echo "No change on Challonge."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '{"asOf":"%s"}' "$(TZ=America/Winnipeg date -Iseconds)" > raw/meta.json
          git config user.name "rice-cup-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/
          git commit -m "Refresh brackets $(TZ=America/Winnipeg date '+%a %H:%M')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Pages
        if: github.event_name == 'push' || steps.fetch.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Package site
        if: github.event_name == 'push' || steps.fetch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deploy
        if: github.event_name == 'push' || steps.fetch.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
