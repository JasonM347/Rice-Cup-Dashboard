name: Check Challonge v2.1 access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/station_probe.py, .github/workflows/probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Where are table assignments?
        env:
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
        run: |
          mkdir -p diag
          python3 scripts/station_probe.py > diag/station_probe.txt 2>&1 || true
          cat diag/station_probe.txt
          git config user.name "rice-cup-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -q -m "Diagnostic output" && git pull -q --rebase origin main && git push -q origin HEAD:main
