name: Check Challonge v2.1 access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/station_probe.py]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Where are table assignments?
        env:
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
        run: python3 scripts/station_probe.py
